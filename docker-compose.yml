services:
  mysql:
    image: mysql:8.4
    container_name: foogra_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foogra
      MYSQL_USER: foogra
      MYSQL_PASSWORD: secret
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Second database used only by the automated test-suite, so `php artisan test`
  # never truncates the demo data you are showing off.
  mysql_test:
    image: mysql:8.4
    container_name: foogra_mysql_test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foogra_test
      MYSQL_USER: foogra
      MYSQL_PASSWORD: secret
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: foogra_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — password-reset mails land here

  # ---------------------------------------------------------------- #
  # The three DevOps-assignment services: backend (api), frontend    #
  # (web) and the `mysql` service above, containerized and wired     #
  # together. `mysql`/`mysql_test`/`mailpit` above stay as they were #
  # for local `php artisan serve` / `npm run dev` development.       #
  # ---------------------------------------------------------------- #
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: foogra-api:local
    container_name: foogra_api
    restart: unless-stopped
    environment:
      APP_NAME: Foogra
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required. Run ./scripts/gen-secrets.sh or `php artisan key:generate --show`}
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8081
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: foogra
      DB_USERNAME: foogra
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: localhost:8081
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ""
    image: foogra-web:local
    container_name: foogra_web
    restart: unless-stopped
    environment:
      API_HOST: api
      API_PORT: "8000"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8080"     # the only port a browser needs

volumes:
  mysql_data:
