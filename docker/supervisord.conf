; Two processes in one container: PHP-FPM for Laravel and nginx in front of
; it. Both log to the container's stdout/stderr so `render logs` shows them.
[supervisord]
nodaemon=true
user=root
; nodaemon already echoes supervisor's own messages to the console; pointing
; logfile at stdout as well would print every line twice.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; If either process dies the container should die with it, so the platform
; restarts a healthy replica instead of serving from a half-up container.
[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL
command=sh -c 'printf "READY\n"; while read -r line; do kill -SIGQUIT "$PPID"; done'
