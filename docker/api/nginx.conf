# API-only nginx config for the split (multi-service) deployment.
# Unlike docker/nginx.conf.template (the combined Render image), this
# container never serves the SPA — only PHP routes and Laravel-owned
# static paths (storage symlink, generated API docs).

user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 25m;

    server {
        listen 8000;
        server_name _;
        root /var/www/html/public;

        index index.php;
        charset utf-8;

        absolute_redirect off;

        location ^~ /api/ {
            try_files $uri /index.php?$query_string;
        }

        location ^~ /sanctum/ {
            try_files $uri /index.php?$query_string;
        }

        location ^~ /docs {
            try_files $uri /index.php?$query_string;
        }

        # Uploaded media: public/storage is a symlink into storage/app/public.
        location ^~ /storage/ {
            try_files $uri /index.php?$query_string;
        }

        # Laravel's built-in framework health check (no DB dependency).
        location = /up {
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120;
        }

        # No SPA fallback here — this container only answers API/framework
        # routes; the frontend container owns everything else.
        location / {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
