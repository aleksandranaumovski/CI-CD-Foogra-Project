[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Without this PHP-FPM strips the environment, and every variable set in the
; Render dashboard (APP_KEY, DB_*, MAIL_*) would be invisible to Laravel.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
