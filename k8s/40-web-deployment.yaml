apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: foogra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: DOCKERHUB_USERNAME/foogra-web:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_HOST
              value: "api"
            - name: API_PORT
              value: "8000"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          # nginx's master chowns /var/cache/nginx/* to the "nginx" user at
          # startup before its own setuid()/setgid() worker drop — needs
          # CAP_CHOWN kept alongside SETUID/SETGID, or it fails to boot.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID", "CHOWN"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
